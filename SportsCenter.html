<meta charset="utf-8">
<title>스포츠센터 관리</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --txt:#222; --sub:#777;
          --accent:#2563eb; --warn:#e11d48; --ok:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--txt); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; gap:6px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header b { font-size:17px; margin-right:12px; }
  nav button { border:0; background:none; padding:8px 12px; border-radius:8px; cursor:pointer;
               font-size:15px; color:var(--sub); }
  nav button.on { background:var(--accent); color:#fff; }
  main { max-width:1000px; margin:16px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:16px; }
  table { width:100%; border-collapse:collapse; }
  th,td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; }
  th { color:var(--sub); font-weight:600; }
  input,select,textarea { font:inherit; padding:7px 9px; border:1px solid var(--line);
          border-radius:8px; background:#fff; width:100%; }
  label { display:block; font-size:13px; color:var(--sub); margin:8px 0 3px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn { background:var(--accent); color:#fff; border:0; padding:8px 14px; border-radius:8px;
         cursor:pointer; font-size:14px; }
  .btn.ghost { background:#eef1f5; color:var(--txt); }
  .btn.danger { background:var(--warn); }
  .btn.sm { padding:4px 9px; font-size:13px; }
  .stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat .card { margin:0; text-align:center; }
  .stat .n { font-size:26px; font-weight:700; }
  .stat .l { color:var(--sub); font-size:13px; }
  .tag { font-size:12px; padding:2px 7px; border-radius:20px; }
  .tag.exp { background:#fde8ec; color:var(--warn); }
  .tag.soon { background:#fff3d6; color:#b45309; }
  .tag.ok { background:#e6f6ec; color:var(--ok); }
  .muted { color:var(--sub); }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .toolbar input { max-width:240px; }
  dialog { border:0; border-radius:14px; padding:0; width:min(480px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dlg-body { padding:18px; }
  .dlg-foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 18px;
              border-top:1px solid var(--line); }
  .right { text-align:right; }
  .hidden { display:none; }
  a.link { color:var(--accent); cursor:pointer; }

  /* ===== 모바일(휴대폰) 전용 레이아웃 ===== */
  @media (max-width: 640px) {
    header { padding:8px 12px; gap:8px; }
    header b { font-size:16px; margin-right:0; }
    nav { flex-basis:100%; width:100%; overflow-x:auto; flex-wrap:nowrap;
          -webkit-overflow-scrolling:touch; order:3; }
    nav button { padding:8px 11px; font-size:14px; white-space:nowrap; }
    #syncBtn { order:2; }
    main { padding:0 10px; margin:12px auto; }
    .card { padding:12px; border-radius:10px; margin-bottom:12px; }
    h2 { font-size:15px; }
    .row { grid-template-columns:1fr; }                 /* 폼 한 줄씩 세로로 */
    .stat { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
    .stat .n { font-size:22px; }
    table { display:block; overflow-x:auto; white-space:nowrap; }  /* 카드·창 안 표 모두 각자 가로 스크롤 */
    th, td { padding:7px 8px; font-size:13px; }
    .toolbar { gap:6px; }
    .toolbar input, .toolbar select { max-width:100%; }
    input, select, textarea { font-size:16px; }          /* iOS 입력 시 자동 확대 방지 */
    dialog { width:96vw; }
    .dlg-body { max-height:78vh; overflow:auto; }        /* 긴 폼은 창 안에서 스크롤 */
    .dlg-foot { flex-wrap:wrap; }
    .btn { padding:9px 13px; }
    .btn.sm { padding:6px 10px; }
  }
</style>

<header>
  <b>🏋️ 스포츠센터 관리</b>
  <nav>
    <button data-tab="dash" class="on">대시보드</button>
    <button data-tab="members">회원</button>
    <button data-tab="lessons">기타수업</button>
    <button data-tab="pay">결제·매출</button>
    <button data-tab="bus">차량운행</button>
    <button data-tab="backup">백업</button>
  </nav>
  <button id="syncBtn" onclick="driveClick()" title="구글 드라이브 동기화"
    style="margin-left:auto; border:1px solid var(--line); background:#fff; color:var(--txt); padding:6px 11px; border-radius:8px; cursor:pointer; font-size:13px">⚪ 로컬 전용</button>
</header>
<main id="app"></main>

<!-- 회원 편집 -->
<dialog id="mDlg"><form method="dialog">
  <div class="dlg-body">
    <h2 id="mTitle">회원 등록</h2>
    <input type="hidden" id="mId">
    <div style="display:flex; gap:14px; align-items:flex-start; margin-bottom:6px">
      <div style="flex:0 0 120px; text-align:center">
        <img id="mPhoto" alt="사진 없음"
             style="width:120px; height:150px; object-fit:cover; border:1px solid var(--line);
                    border-radius:8px; background:#f0f2f5; color:var(--sub); font-size:12px">
        <video id="mCam" autoplay playsinline muted
             style="display:none; width:120px; height:150px; object-fit:cover; border-radius:8px; background:#000"></video>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px">
        <button type="button" class="btn ghost sm" id="mCamBtn">📷 카메라 켜기</button>
        <button type="button" class="btn sm" id="mShot" style="display:none">📸 촬영</button>
        <button type="button" class="btn ghost sm" id="mPhotoFileBtn">🖼️ 파일에서 불러오기</button>
        <button type="button" class="btn ghost sm" id="mPhotoClear">사진 삭제</button>
        <input type="file" id="mPhotoFile" accept="image/*" class="hidden">

      </div>
    </div>
    <div class="row">
      <div><label>이름 *</label><input id="mName" required></div>
      <div><label>연락처</label><input id="mPhone" placeholder="010-0000-0000"></div>
    </div>
    <div class="row">
      <div><label>주 이용 횟수</label>
        <select id="mFreq"><option value="2">주 2회</option><option value="3">주 3회</option><option value="5">주 5회</option></select></div>
      <div><label>등록 기간</label>
        <select id="mMonths"><option value="1">1개월</option><option value="3">3개월</option></select></div>
    </div>
    <div class="row">
      <div><label>상태</label>
        <select id="mActive"><option value="1">이용중</option><option value="0">중지/탈퇴</option></select></div>
      <div><label>시작일</label><input type="date" id="mStart"></div>
    </div>
    <div class="row">
      <div><label>만료일 <span class="muted">(시작일·기간에서 자동)</span></label><input type="date" id="mEnd"></div>
      <div></div>
    </div>
    <div class="row">
      <div><label>차량 이용</label>
        <select id="mBus"><option value="0">미이용</option><option value="1">이용</option></select></div>
      <div><label>노선 (선택)</label><select id="mRoute"></select></div>
    </div>
    <div class="row">
      <div><label>승차 위치</label><input id="mPickup" placeholder="예: A복지관 앞"></div>
      <div><label>하차 위치</label><input id="mDropoff" placeholder="예: OO아파트 정문"></div>
    </div>
    <div class="row">
      <div><label>승차 시간 <span class="muted">(등원 배차)</span></label><input type="time" id="mBoard"></div>
      <div><label>하차 시간 <span class="muted">(하원 배차)</span></label><input type="time" id="mDrop"></div>
    </div>
    <div class="row">
      <div><label>수업 시간</label><input id="mClass" placeholder="예: 15:00~16:00 / 오후반"></div>
      <div></div>
    </div>
    <label>집주소</label><input id="mAddr">
    <div class="row">
      <div><label>보호자 전화번호</label><input id="mGuardian" placeholder="010-0000-0000"></div>
      <div><label>기관정보</label><input id="mOrg" placeholder="예: ○○복지관"></div>
    </div>
    <label>메모</label><textarea id="mMemo" rows="2"></textarea>
    <div id="mPaySection" style="border-top:1px solid var(--line); margin-top:12px; padding-top:10px">
      <div style="display:flex; align-items:center; gap:8px">
        <b>결제 내역</b><span style="flex:1"></span>
        <button type="button" class="btn sm" id="mAddPay">+ 이 회원 결제 등록</button>
      </div>
      <div id="mPays" style="margin-top:6px"></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button type="button" class="btn danger sm" id="mDel">삭제</button>
    <span style="flex:1"></span>
    <button value="cancel" class="btn ghost">취소</button>
    <button type="button" class="btn" id="mSave">저장</button>
  </div>
</form></dialog>

<script>
// ---- 저장소 (localStorage 단일 JSON) ----
const KEY = "sportscenter.db.v1";
const DEFAULTS = { members:[], payments:[], routes:[], expenses:[], fixedCosts:[], seq:1, updatedAt:0,
  vehicleCount:2, vehicleSeats:12, runMinutes:40,   // 정원·1회 운행 소요시간(지도 거리 대신 가정값)
  // 요금표: "주횟수_개월" → 원.  아는 값만 채움, 나머지는 백업 탭에서 입력
  prices:{ "2_1":0, "2_3":400000, "3_1":0, "3_3":0, "5_1":0, "5_3":0 },
  busFee:60000, // 차량운행비(월). 등록 기간만큼 곱해 청구
  // 경비율(추계) 설정 — 스포츠·여가 서비스업 예시값. 홈택스에서 본인 업종코드 값 확인 후 수정
  tax:{ simpleRate:79.0, standardRate:19.0, prevIncome:0 },
  // 추가수업(강의) — 정규수업 외. 5회/10회 요금은 백업·설정에서 수정
  lessons:[{name:"웨이크보드",price5:0,price10:0},{name:"인라인",price5:0,price10:0},{name:"프리다이빙",price5:0,price10:0}],
  // 강의 수강 등록: {회원, 강의, 5/10회, 사용횟수, 결제여부, 요금}
  lessonEnrolls:[] };
const EXP_CATS = ["강사비","임대료","공과금","비품","광고","기타"];
// 업종별 기준수입금액(예술·스포츠·여가 서비스업) — 이 미만이면 단순경비율 적용 (소득령§143)
const SIMPLE_LIMIT_CONT = 24000000;  // 계속사업자: 직전연도 기준
const SIMPLE_LIMIT_NEW  = 75000000;  // 신규사업자: 해당연도 기준 (= 복식부기의무 기준)
const db = load();
migrate();
// 구버전 데이터 이관: 단일 강의요금→10회요금, 회원.lessons 배열→수강등록
function migrate(){
  let changed=false;
  (db.lessons||[]).forEach(l=>{ if(l.price!==undefined){ if(l.price5===undefined)l.price5=0; if(l.price10===undefined)l.price10=l.price; delete l.price; changed=true; } });
  (db.members||[]).forEach(m=>{ if(m.lessons){ m.lessons.forEach(name=>{
    if(!db.lessonEnrolls.some(e=>e.memberId===m.id&&e.lesson===name))
      db.lessonEnrolls.push({id:nid(),memberId:m.id,lesson:name,sessions:10,log:[],paid:false,price:0}); });
    delete m.lessons; changed=true; } });
  // 출석 횟수(used) → 날짜 로그(log)로 이관 (과거 날짜는 미상)
  (db.lessonEnrolls||[]).forEach(e=>{ if(e.log===undefined){ e.log=Array(e.used||0).fill(""); delete e.used; changed=true; } });
  if(changed) save();
}
function load(){
  try { return Object.assign(structuredClone(DEFAULTS), JSON.parse(localStorage[KEY]||"{}")); }
  catch { return structuredClone(DEFAULTS); }
}
// ponytail: 사진을 data-URL로 localStorage에 저장(수백 명까지 충분). 용량 넘치면 IndexedDB로 이전.
function saveLocal(){
  try { localStorage[KEY] = JSON.stringify(db); }
  catch(e){ alert("저장 공간이 부족합니다.\n백업(내보내기) 후 오래된 데이터를 정리하거나 사진 수를 줄여주세요."); }
}
function save(){ db.updatedAt = Date.now(); saveLocal(); schedulePush(); }

// ================= 구글 드라이브 동기화 (앱 전용 폴더) =================
const G_SCOPE="https://www.googleapis.com/auth/drive.appdata";
const G_FILE="sportscenter_data.json";
let gapiReady=false, gisReady=false, tokenClient=null, accessToken=null, driveFileId=null, pushTimer=null;
let syncStatus="off";   // off(로컬)·ready(로그인가능)·syncing·synced·error
const lsGet = k => { try{ return localStorage[k]||""; }catch(e){ return ""; } };
const clientId = () => (window.GOOGLE_CLIENT_ID||"") || lsGet("sportscenter.gClientId");
function gapiLoaded(){ gapi.load("client", async ()=>{
  try{ await gapi.client.init({discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]}); gapiReady=true; maybeInitGis(); }catch(e){} }); }
function gisLoaded(){ gisReady=true; maybeInitGis(); }
function maybeInitGis(){
  if(!gapiReady||!gisReady||!clientId()){ updateSyncUI(); return; }
  try{ tokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId(), scope:G_SCOPE, callback:onToken});
    syncStatus="ready"; }catch(e){ syncStatus="error"; }
  updateSyncUI();
}
async function onToken(resp){
  if(resp.error){ syncStatus="error"; updateSyncUI(); return; }
  accessToken=resp.access_token; gapi.client.setToken(resp);
  await driveSyncOnLogin();
}
function statusLabel(){ return ({off:"⚪ 로컬 전용", ready:"☁ 구글 로그인", syncing:"⏳ 동기화 중…", synced:"✅ 동기화됨", error:"❌ 동기화 오류"})[syncStatus]||"⚪ 로컬"; }
function updateSyncUI(){
  const b=document.getElementById("syncBtn"); if(b) b.textContent=statusLabel();
  const d=document.getElementById("syncDetail"); if(d) d.textContent = clientId()? (accessToken? "로그인됨 · 저장 시 드라이브에 자동 반영":"") : "클라이언트 ID를 저장한 뒤 새로고침하세요.";
}
async function driveFind(){
  const r=await gapi.client.drive.files.list({spaces:"appDataFolder", fields:"files(id,modifiedTime)", q:`name='${G_FILE}'`});
  const f=r.result.files&&r.result.files[0]; driveFileId=f?f.id:null; return f;
}
async function drivePull(){
  await driveFind(); if(!driveFileId) return null;
  const r=await gapi.client.drive.files.get({fileId:driveFileId, alt:"media"});
  return JSON.parse(r.body);
}
async function drivePush(){
  const content=JSON.stringify(db);
  if(!driveFileId){
    const meta={name:G_FILE, parents:["appDataFolder"], mimeType:"application/json"}, b="ptmate314159";
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${b}--`;

function expiry(m){
  if(!m.end) return {t:"ok",label:"-"};
  const days = Math.ceil((new Date(m.end) - new Date(today()))/86400000);
  if(days < 0) return {t:"exp",label:"만료"};
  if(days <= 30) return {t:"soon",label:`D-${days}`};
  return {t:"ok",label:new Date(m.end).toLocaleDateString("ko-KR")};
}

// 차량 이용 여부(신규는 m.bus, 기존 데이터는 노선 지정으로 판단)
const busOn = m => m.bus===undefined ? !!m.route : !!m.bus;
// 회원권 요금 + (차량 이용 시) 차량비×개월
function memberFee(m){
  const months = m.months||1;
  const base = +(db.prices[`${m.freq}_${months}`]||0);
  const bus = busOn(m) ? (+db.busFee||0)*months : 0;
  return { base, bus, total:base+bus };
}

function monthlyValue(m){
  const months=m.months||1;
  return Math.round((+(db.prices[`${m.freq}_${months}`]||0))/months) + (busOn(m)?(+db.busFee||0):0);
}
const sum = (arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
const inMonth = (arr, ym)=>arr.filter(x=>(x.date||"").startsWith(ym));
const fixedTotal = ()=>sum(db.fixedCosts,c=>c.amount);
// 미납/갱신필요 회원: 이용중인데 결제기록이 아예 없거나(미납), 만료일이 지남(갱신필요)
function unpaidMembers(){
  const paidIds = new Set(db.payments.map(p=>p.memberId));
  return db.members.filter(m=>m.active!=0).map(m=>{
    if(!paidIds.has(m.id)) return {m, reason:"미납(결제기록 없음)"};
    if(m.end && new Date(m.end) < new Date(today())) return {m, reason:"만료·갱신 미결제"};
    return null;
  }).filter(Boolean);
}
function addMonths(dateStr, n){
  if(!dateStr) return "";
  const d = new Date(dateStr); const day = d.getDate();
  d.setMonth(d.getMonth()+ (+n||0));
  if(d.getDate()<day) d.setDate(0); // 말일 보정
  return d.toISOString().slice(0,10);
}

function shrink(src, w, h){
  const dw=240, dh=Math.round((h/w)*dw)||300;
  const c=document.createElement("canvas"); c.width=dw; c.height=dh;
  c.getContext("2d").drawImage(src,0,0,dw,dh);
  return c.toDataURL("image/jpeg",0.7);
}

function renewEnd(m, date){
  const months=m.months||1;
  const base=(m.end && m.end>=date)? m.end : date;
  return addMonths(base, months);
}

// 2024 종합소득세 누진세율표 [과세표준 상한, 세율, 누진공제]
function estIncomeTax(taxable){
  const b=[[14000000,0.06,0],[50000000,0.15,1260000],[88000000,0.24,5760000],
    [150000000,0.35,15440000],[300000000,0.38,19940000],[500000000,0.40,25940000],
    [1000000000,0.42,35940000],[Infinity,0.45,65940000]];
  if(taxable<=0) return {tax:0, rate:0.06};
  for(const [cap,rate,ded] of b) if(taxable<=cap) return {tax:Math.max(0,Math.round(taxable*rate-ded)), rate};
}
function taxHelperCard(){
  const yr=taxYr, byYr=x=>(x.date||"").startsWith(yr);

  const taxable=Math.max(0,income-expense);
  const cur=estIncomeTax(taxable), noExp=estIncomeTax(Math.max(0,income));
  const local=t=>Math.round(t*1.1);                       // 지방소득세 10% 포함
  const saved=local(noExp.tax)-local(cur.tax);            // 경비 기록으로 자동 절감된 세금
  const marg=Math.round(cur.rate*1100)/10;               // 한계세율(지방세 포함) %
  const per=Math.round(10000*cur.rate*1.1);              // 경비 1만원당 절세액

    {k:["노란우산","공제부금"],t:"노란우산공제",tip:"소득공제 연 최대 500만원(가입 시)"},
    {k:["보험","4대","연금"],t:"보험료",tip:"사업 관련 보험·4대보험 사업주 부담분"},
    {k:["광고","홍보","마케팅","전단","간판"],t:"광고·홍보비",tip:"전단·SNS·간판 제작비"},
    {k:["수수료","카드","결제","pg"],t:"카드·결제 수수료",tip:"카드사·PG 결제 수수료"},
    {k:["소모품","비품","용품","기구"],t:"비품·소모품비",tip:"운동기구·청소용품 등"},
    {k:["교육","세미나","도서"],t:"교육·도서비",tip:"업무 관련 교육·자료비"},
  ].map(c=>({...c, has:c.k.some(w=>blob.includes(w))}));
  const missing=checks.filter(c=>!c.has), have=checks.filter(c=>c.has);
  return `<div class="card">
    <h2>💡 절세 도우미 <span class="muted" style="font-size:13px">· ${yr}년 (참고용 추정)</span></h2>
    <div class="stat">
      <div class="card"><div class="n">${won(taxable)}</div><div class="l">과세소득 (수입−경비)</div></div>
      <div class="card"><div class="n" style="color:var(--ok)">−${won(saved)}</div><div class="l">경비 기록으로 자동 절감된 세금</div></div>
      <div class="card"><div class="n">약 ${won(local(cur.tax))}</div><div class="l">예상 소득세 (지방세 포함)</div></div>
    </div>
    <p style="margin:12px 0 4px"><b>지출을 경비로 빠짐없이 기록하는 것이 가장 확실한 절세입니다.</b>
       현재 한계세율 약 ${marg}% → <b>경비 1만원당 약 ${won(per)}</b>의 세금이 줄어듭니다.</p>
    <p style="margin:14px 0 6px"><b>놓치기 쉬운 경비·공제 (아직 기록 없음 — 해당되면 지출로 추가하세요)</b></p>

    ${have.length? `<p class="muted" style="font-size:13px;margin-top:8px">✓ 이미 반영: ${have.map(c=>c.t).join(", ")}</p>`:``}

      실제 신고와 공제 적용은 반드시 세무사와 확인하세요.</p>
  </div>`;
}
// 신고방법 비교: 장부(기장) vs 단순경비율 vs 기준경비율 → 소득금액 낮은 쪽이 절세
function reportCompare(income, bookIncome){
  const t=db.tax||{}, byYr=x=>(x.date||"").startsWith(taxYr);
  const sRate=(+t.simpleRate||0)/100, stdRate=(+t.standardRate||0)/100, prev=+t.prevIncome||0;
  const isNew = prev===0;
  const complexObligor = (isNew?income:prev) >= SIMPLE_LIMIT_NEW;   // 복식부기의무자
  const simpleOk = isNew ? income < SIMPLE_LIMIT_NEW : prev < SIMPLE_LIMIT_CONT;
  // 주요경비 = 임차료(임대료) + 인건비(강사비)
  const mainExp = sum(db.expenses.filter(e=>byYr(e) && (e.category==="임대료"||e.category==="강사비")),e=>e.amount);
  const incSimple = Math.round(income*(1-sRate));
  const incStd = Math.max(0, income - mainExp - Math.round(income*stdRate*(complexObligor?0.5:1)));
  const local=x=>Math.round(x*1.1);
  const rows=[
    {name:"장부(기장) 신고", inc:bookIncome, ok:true, note:"실제 수입 − 실제 경비 (권장: 기장세액공제 가능)"},
    {name:"단순경비율 추계", inc:incSimple, ok:simpleOk, note:`수입 × (1 − ${t.simpleRate||0}%)`},
    {name:"기준경비율 추계", inc:incStd, ok:true, note:`수입 − 주요경비 − 수입×${t.standardRate||0}%${complexObligor?" (기타경비 ½)":""}`},
  ];
  const best = rows.filter(r=>r.ok).reduce((a,b)=>b.inc<a.inc?b:a);
  return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
    <p style="margin:0 0 6px"><b>📊 신고방법 비교</b> <span class="muted" style="font-size:13px">— 소득금액이 낮을수록 세금이 적습니다</span></p>
    <div style="overflow-x:auto">${table(["신고 방법","소득금액","예상 소득세","적용"],
      rows.map(r=>{
        const isBest = r.ok && r===best;
        return `<tr${isBest?' style="background:#e6f6ec"':''}>
          <td>${r.name}${isBest?' <b style="color:var(--ok)">← 유리</b>':''}<div class="muted" style="font-size:12px">${r.note}</div></td>
          <td class="right">${won(r.inc)}</td>
          <td class="right">${r.ok?'약 '+won(local(estIncomeTax(r.inc).tax)):'-'}</td>
          <td>${r.ok?'가능':'<span class="muted">대상 아님</span>'}</td></tr>`;
      }).join(""))}</div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">

// ---- 차량운행 ----
// 배차 모드: arrive=등원(등원시간+승차위치), leave=하원(하원시간+하차위치)
let busSuggestions=[], busMode="arrive";
const KIND_LABEL={arrive:"등원",leave:"하원",board:"등원",drop:"하원"};  // board/drop=구버전 호환
const kindOf = k => KIND_LABEL[k]||"";
const pickupOf = m => m.pickup||m.stop||"";     // 기존 정류장은 승차로 취급
const dropoffOf = m => m.dropoff||"";
const boardT = m => m.boardTime ?? m.arriveTime ?? "";   // 승차 시간 (등원 배차)
const classT = m => m.classTime ?? m.leaveTime ?? "";    // 수업 시간 (정보용)
const dropT  = m => m.dropTime ?? m.leaveTime ?? "";     // 하차 시간 (하원 배차, 없으면 옛 하원시간)
const timeOf = (m,mode)=> mode==="arrive" ? boardT(m) : dropT(m);
const locOf  = (m,mode)=> mode==="arrive" ? (pickupOf(m)||m.org||"") : (dropoffOf(m)||m.addr||"");
// 그룹 기준: 등원=기관(어린이집·유치원·학교) 단위, 하원=동네/아파트(주소) 단위
const groupOf = (m,mode)=> mode==="arrive"
  ? (m.org || pickupOf(m) || "기관 미지정")
  : regionKey(dropoffOf(m) || m.addr);
// 하원시간을 30분 단위 구간으로 (비슷한 시간끼리 묶기)
function timeBucket(t){
  if(!t) return "시간 미정";
  const [h,mm]=t.split(":").map(Number); const pad=n=>String(n).padStart(2,"0");
  return mm<30 ? `${pad(h)}:00~${pad(h)}:30` : `${pad(h)}:30~${pad(h+1)}:00`;
}
// 위치 앞 2어절로 지역 묶기 (예: "세종시 나성동 3-1" → "세종시 나성동")
const regionKey = s => { const p=(s||"").trim().split(/\s+/).filter(Boolean); return p.slice(0,2).join(" ")||"위치 미지정"; };
// 전체 차량이용 회원을 하원시간+위치지역으로 묶고, 그룹 안은 위치순 정렬 (승차/하차 기준 선택)
// 이미 노선이 있어도 포함 → 비슷한데 여러 노선/미지정에 흩어진 그룹을 찾아냄
function computeSuggestions(mode){
  const riders=db.members.filter(m=>busOn(m) && m.active!=0);
  const map={};
  riders.forEach(m=>{
    const bucket=timeBucket(timeOf(m,mode)), region=groupOf(m,mode);
    const key=bucket+" | "+region;
    (map[key]=map[key]||{bucket,region,list:[]}).list.push(m);
  });
  busSuggestions=Object.values(map).map(g=>{
    const list=g.list.sort((a,b)=>locOf(a,mode).localeCompare(locOf(b,mode),"ko"));
    const routeSet=new Set(list.map(m=>m.route||0));           // 0 = 미지정
    // 이미 한 노선으로 정리됨 = 모두 같은 노선(미지정 아님)
    const unified = routeSet.size===1 && !routeSet.has(0);
    return {...g, list, unified, routeId: unified? [...routeSet][0]:null};
  }).sort((a,b)=> (a.unified?1:0)-(b.unified?1:0) || ((a.bucket+a.region)<(b.bucket+b.region)?-1:1));
  return busSuggestions;
}
window.setBusMode=function(mode){ busMode=mode; renderBus(); };
window.makeSuggestedRoute=function(idx){
  const g=busSuggestions[idx]; if(!g) return;
  const kindLabel = kindOf(busMode);
  const name=`[${kindLabel}] ${g.bucket} ${g.region}`.slice(0,34);
  const startT = /^\d/.test(g.bucket) ? g.bucket.split("~")[0].trim() : "";  // "09:00~09:30" → "09:00"
  const r={id:nid(), name, kind:busMode, time:startT, info:`${kindLabel} · ${g.bucket} · ${g.region}`}; db.routes.push(r);
  g.list.forEach(m=>{ m.route=r.id; m.bus=true; });
  // 회원이 빠져나가 비어버린 기존 노선은 자동 삭제
  db.routes = db.routes.filter(rt=> rt.id===r.id || db.members.some(m=>m.route===rt.id));
  save(); render();
};
const routeNameById = id => (db.routes.find(r=>r.id===id)||{}).name || "미지정";
// 호차 자동 배정: 운행 시간 순서로, 한 호차가 겹치지 않게(1회 소요시간 기준) + 정원 고려
// ※ 지도 거리 미반영 — runMinutes(1회 소요시간)로 근사
window.autoAssignVehicles=function(){
  const timed=db.routes.filter(r=>/^\d/.test(r.time||""));
  if(!timed.length){ alert("운행 시간이 있는 노선이 없습니다.\n노선 수정에서 운행 시간을 입력하거나, 자동 제안으로 노선을 만드세요."); return; }
  const N=db.vehicleCount||2, seats=db.vehicleSeats||12, dur=db.runMinutes||40;
  const toMin=t=>{ const [h,m]=t.split(":").map(Number); return h*60+m; };
  const cnt=rid=>db.members.filter(m=>busOn(m)&&m.route===rid&&m.active!=0).length;
  const veh=Array.from({length:N},()=>({free:-1e9}));   // free=비는 시각(분)
  const conflicts=[], overCap=[];
  timed.slice().sort((a,b)=>toMin(a.time)-toMin(b.time)).forEach(r=>{
    const start=toMin(r.time), end=start+dur;
    if(cnt(r.id)>seats) overCap.push(`${r.name}(${cnt(r.id)}명)`);
    // 시작 전에 비는 호차 중, 가장 늦게까지 논(=활용도 높은) 호차 우선
    let pick=-1, best=-1e9;
    for(let i=0;i<N;i++) if(veh[i].free<=start && (pick<0 || veh[i].free>best)){ best=veh[i].free; pick=i; }
    if(pick<0){ // 전부 바쁨 → 가장 먼저 비는 호차, 시간 충돌로 표시
      pick=0; for(let i=1;i<N;i++) if(veh[i].free<veh[pick].free) pick=i;
      conflicts.push(`${r.name}(${r.time})`);
    }
    r.vehicle=pick+1; veh[pick].free=end;
  });
  save(); render();
  let msg=`운행 시간이 있는 ${timed.length}개 노선을 ${N}호차에 자동 배정했습니다. (1회 소요 ${dur}분 기준)`;
  const untimed=db.routes.length-timed.length;
  if(untimed) msg+=`\n· 시간 없는 ${untimed}개 노선은 제외 (수정에서 운행 시간 입력)`;
  if(conflicts.length) msg+=`\n⚠️ 차량 부족(시간 겹침): ${conflicts.join(", ")} → 대수를 늘리거나 시간을 조정하세요.`;
  if(overCap.length) msg+=`\n⚠️ 정원(${seats}명) 초과: ${overCap.join(", ")} → 노선을 나누세요.`;
  alert(msg);
};
function renderBus(){
  const riderTable = riders => riders.length? `<div style="overflow-x:auto">`+table(["이름","승차","수업","하차","승차위치","하차위치","연락처"],
      riders.slice().sort((a,b)=>(timeOf(a,busMode)||"").localeCompare(timeOf(b,busMode)||"")||a.name.localeCompare(b.name,"ko")).map(m=>
        `<tr><td>${m.name}</td><td>${boardT(m)||"-"}</td><td>${classT(m)||"-"}</td><td>${m.dropTime||"-"}</td><td>${pickupOf(m)||"-"}</td><td>${dropoffOf(m)||"-"}</td><td>${m.phone||""}</td></tr>`).join(""))+`</div>`
      : `<p class="muted" style="margin:4px 0 0">해당 회원이 없습니다.</p>`;
  const sugg=computeSuggestions(busMode);
  const isArrive = busMode==="arrive", modeLabel=kindOf(busMode);
  const timeCol = isArrive?"승차 시간":"하차 시간";

  // 호차별 운행 스케줄: 한 호차가 시간 순서대로 여러 번 운행
  const schedule = (()=>{
    const vs=[]; for(let i=1;i<=(db.vehicleCount||2);i++) vs.push(i); vs.push(null);

        ${rs.length? `<div style="overflow-x:auto"><table>${rs.map(r=>`<tr>
            <td style="width:64px">${r.time||"-"}</td><td>${kindTagOf(r.kind)}</td>

            <td class="right"><button class="btn ghost sm" onclick="editRoute(${r.id})">호차·시간</button></td>
          </tr>`).join("")}</table></div>`
          : `<p class="muted" style="margin:4px 0">배정된 노선이 없습니다.</p>`}
      </div>`;
    }).join("");
  })();
  $("#app").innerHTML = `
  <div class="card">
    <div class="toolbar"><h2 style="margin:0">🚐 호차별 운행 스케줄</h2>
      <span style="flex:1"></span>
      <button class="btn" onclick="autoAssignVehicles()">⚙️ 호차 자동 배정</button></div>

    <p class="muted" style="font-size:12px;margin-top:4px">한 호차가 시간 순서대로 여러 번(등원→다음 등원→하원) 운행합니다.
      <b>자동 배정</b>은 운행 시간이 겹치지 않게 + 정원을 고려해 호차를 나눕니다
      (1회 소요 ${db.runMinutes||40}분·정원 ${db.vehicleSeats||12}명 기준, <a class="link" onclick="gotoBackup()">설정</a>에서 조정).
      <b>지도 실제 거리는 미반영</b>입니다.</p>
  </div>
  <div class="card">
    <div class="toolbar"><h2 style="margin:0">노선별 탑승 명단</h2>
      <span style="flex:1"></span>
      <button class="btn" onclick="editRoute()">+ 노선 등록</button></div>
    ${(()=>{
      const groups = db.routes.map(r=>{
        const riders = db.members.filter(m=>busOn(m) && m.route===r.id && m.active!=0);
        const vehTag = r.vehicle? `<span class="tag">${r.vehicle}호차</span> `:"";
        return `<div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:8px">
            ${vehTag}${kindTagOf(r.kind)} <b>${r.name}</b> <span class="muted">${r.info||""}</span>
            <span class="muted">· ${riders.length}명</span>
            <span style="flex:1"></span>
            <button class="btn ghost sm" onclick="editRoute(${r.id})">수정</button>

  </div>
  <div class="card">

      <span style="flex:1"></span>
      <button class="btn ${isArrive?'':'ghost'} sm" onclick="setBusMode('arrive')">등원 배차</button>
      <button class="btn ${isArrive?'ghost':''} sm" onclick="setBusMode('leave')">하원 배차</button>
    </div>
    <p class="muted" style="font-size:13px;margin-top:0"><b>${modeLabel} 배차</b>: 전체 차량이용 회원을 <b>${timeCol}(30분 단위) + ${groupByLabel} 단위</b>로 묶고, 그룹 안은 <b>${locCol}순</b>으로 정렬했습니다(동선 참고용, 지도 최적화 아님).
      비슷한데 <b>여러 노선/미지정에 흩어진 그룹</b>을 위에 먼저 보여주고 <b>합치기</b>를 제안합니다.</p>
    ${(()=>{
      const scattered=sugg.filter(g=>!g.unified), organized=sugg.filter(g=>g.unified);
      if(!sugg.length) return `<p class="muted">차량 이용 회원이 없습니다. (회원 등록 시 '차량 이용'+${timeCol}·${locCol} 입력)</p>`;
      const card=(g,i)=>`
        <div style="margin-bottom:16px;border:1px solid ${g.unified?'var(--line)':'var(--warn)'};border-radius:10px;padding:12px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <b>🕒 ${g.bucket}</b> <span class="tag ${isArrive?'ok':'soon'}">${modeLabel} · ${g.region}</span>
            <span class="muted">· ${g.list.length}명</span>
            ${g.unified? `<span class="tag ok">✓ ${routeNameById(g.routeId)} 운영 중</span>`
                       : `<span class="tag exp">여러 노선/미지정에 흩어짐</span>`}
            <span style="flex:1"></span>
            <button class="btn sm" onclick="makeSuggestedRoute(${i})">${g.unified?'노선 다시 만들기':'이 그룹으로 노선 합치기'}</button>
          </div>
          <div style="overflow-x:auto">${table(["순서","이름",timeCol,locCol,"현재 노선","연락처"], g.list.map((m,k)=>
            `<tr><td>${k+1}</td><td>${m.name}</td><td>${timeOf(m,busMode)||"-"}</td>
             <td>${locOf(m,busMode)||'<span class="muted">미입력</span>'}</td>
             <td>${m.route?routeNameById(m.route):'<span class="tag exp">미지정</span>'}</td>
             <td>${m.phone||""}</td></tr>`).join(""))}</div>
        </div>`;
      const idxOf=g=>sugg.indexOf(g);
      let html="";
      if(scattered.length) html+=`<p style="margin:6px 0"><b>⚠️ 정리 필요 (${scattered.length}그룹)</b></p>`+scattered.map(g=>card(g,idxOf(g))).join("");
      if(organized.length) html+=`<p style="margin:14px 0 6px" class="muted"><b>정리된 그룹 (${organized.length})</b></p>`+organized.map(g=>card(g,idxOf(g))).join("");
      return html;
    })()}
  </div>`;
}
function vehicleOptions(sel){
  let o=`<option value="">미지정</option>`;
  for(let i=1;i<=(db.vehicleCount||2);i++) o+=`<option value="${i}" ${i===sel?"selected":""}>${i}호차</option>`;
  return o;
}
window.editRoute = function(id){
  const r = id? db.routes.find(x=>x.id===id) : {};
  $("#rTitle").textContent = id? "노선 수정":"노선 등록";
  $("#rId").value=id||""; $("#rName").value=r.name||""; $("#rInfo").value=r.info||"";
  $("#rVehicle").innerHTML=vehicleOptions(r.vehicle); $("#rTime").value=r.time||"";
  $("#rDel").classList.toggle("hidden",!id);
  $("#rDlg").showModal();
};
$("#rSave").onclick = ()=>{
  const name=$("#rName").value.trim(); if(!name){ alert("노선 이름을 입력하세요"); return; }
  const id=+$("#rId").value;
  const r = id? db.routes.find(x=>x.id===id) : (db.routes.push({id:nid()}), db.routes[db.routes.length-1]);
  Object.assign(r,{ name, info:$("#rInfo").value.trim(), vehicle:+$("#rVehicle").value||null, time:$("#rTime").value });
  save(); $("#rDlg").close(); render();
};
$("#rDel").onclick = ()=>{
  const id=+$("#rId").value;
  if(!confirm("노선을 삭제할까요? 배정된 회원의 노선은 해제됩니다.")) return;
  db.routes = db.routes.filter(x=>x.id!==id);
  db.members.forEach(m=>{ if(m.route===id) m.route=null; });
  save(); $("#rDlg").close(); render();
};

function savePrices(){
  document.querySelectorAll("[data-price]").forEach(el=>{ db.prices[el.dataset.price]=+el.value||0; });
  db.busFee = +$("#busFee").value||0;
  db.vehicleCount = Math.max(1, +$("#vehicleCount").value||2);
  db.vehicleSeats = Math.max(1, +$("#vehicleSeats").value||12);
  db.runMinutes = Math.max(5, +$("#runMinutes").value||40);
  save(); alert("요금표를 저장했습니다.");
}
function saveTax(){
  db.tax = { simpleRate:+$("#taxSimple").value||0, standardRate:+$("#taxStd").value||0, prevIncome:+$("#taxPrev").value||0 };
  save(); alert("경비율을 저장했습니다. 세금 탭에서 신고방법 비교가 갱신됩니다.");
}
// ---- 월 고정비 편집 ----
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function addFixed(){ db.fixedCosts.push({id:nid(), category:"강사비", memo:"", amount:0}); save(); renderBackup(); }
function setFixed(id,k,v){
  const c=db.fixedCosts.find(x=>x.id===id); if(!c) return;
  c[k] = k==="amount" ? (+v||0) : v;
  save(); if(k==="amount") renderBackup();   // 합계 갱신
}
function delFixed(id){ db.fixedCosts=db.fixedCosts.filter(x=>x.id!==id); save(); renderBackup(); }
// ---- 추가수업(강의) 편집 ----
function addLesson(){ db.lessons.push({name:"새 강의", price5:0, price10:0}); save(); renderBackup(); }
function setLesson(i,k,v){
  const l=db.lessons[i]; if(!l) return;
  if(k==="name"){ const old=l.name, nw=v.trim()||l.name;
    // 이름 변경 시 회원 참여명단·결제 태그도 함께 갱신
    db.members.forEach(m=>{ if(m.lessons) m.lessons=m.lessons.map(x=>x===old?nw:x); });
    db.payments.forEach(p=>{ if(p.lesson===old) p.lesson=nw; });
    l.name=nw;
  } else l[k]=+v||0;   // price5 / price10
  save(); renderBackup();
}
function delLesson(i){
  const l=db.lessons[i]; if(!l) return;
  if(!confirm(`'${l.name}' 강의를 삭제할까요? 참여 명단에서도 제외됩니다. (결제 내역은 유지)`)) return;
  db.members.forEach(m=>{ if(m.lessons) m.lessons=m.lessons.filter(x=>x!==l.name); });
  db.lessons.splice(i,1); save(); renderBackup();
}
function exportJson(){
  const blob = new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`스포츠센터백업_${today()}.json`; a.click();
}
function importJson(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!Array.isArray(d.members)) throw 0;
    if(!confirm("현재 데이터를 이 파일 내용으로 덮어씁니다. 계속할까요?")) return;
    Object.assign(db, structuredClone(DEFAULTS), d); save(); render();
    alert("가져오기 완료");
  }catch{ alert("올바른 백업 파일이 아닙니다."); } };
  r.readAsText(f);
}
